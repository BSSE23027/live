name: Reply to new reports

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const quoted = (context.payload.issue.body || '(no description provided)')
              .split('\n').map(l => '> ' + l).join('\n');

            const body = [
              ':wave: Please note that this issue will be automatically closed shortly.',
              '',
              'For prompt assistance and a timely resolution, we kindly advise you to click here:',
              '[Live Support Team](https://tawk.to/chat/63264fa337898912e969cc57/1gd6qe67p)',
              '',
              'Once on the page, click on new support request with ticket ID NN38 to initiate a conversation with a live support agent who will guide you through the process.',
              '',
              'You may also contact our support team directly at',
              '[MAIL](mailto:sandeepemailone@aol.com)',
              '',
              '— Team :fire:',
              '',
              '---',
              '',
              '**Description**',
              quoted
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
